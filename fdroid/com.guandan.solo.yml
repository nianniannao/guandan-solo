AutoName: 掼蛋

Summary: 国标掼蛋，三档 AI，五行视觉，局域网联机
Description: |
  国标江苏掼蛋（两副牌 108 张、逢人配、天王炸），三档 AI：初级简单策略、
  高级打分决策、终极打分加残局蒙特卡洛推演；思考强度可按难度独立选择快/标准/深度。

  纯离线运行，无账号、无广告、无统计；五行八卦视觉，横屏牌桌；内置 54 段离线中文
  语音（单张报点数、其余只报牌型，跟牌用「大你/管住」，过牌用「要不起」），可一键
  关闭；出牌节奏 2/3/5/6 秒可调；自动存档并可继续上一局；局域网联机支持 UDP 广播
  自动发现房间、断线重连与 22 秒出牌超时托管，可与鸿蒙版互通。

