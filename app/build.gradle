plugins {
    id 'com.android.application'
}

android {
    namespace 'com.guandan.solo'
    compileSdk 34

    defaultConfig {
        applicationId "com.guandan.solo"
        minSdk 21
        targetSdk 34
        versionCode 20
        versionName "8.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
